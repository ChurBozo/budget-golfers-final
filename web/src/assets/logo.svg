  <path d="M35.6 12.5 50 18.2l-14.4 5.8z" fill="#A0D6B4"/>
  <!-- ball (coin notch = budget) -->
  <circle cx="21" cy="38" r="7" fill="#FFFFFF"/>
  <circle cx="19" cy="36" r="1" fill="#B8D8D0"/>
  <circle cx="22.5" cy="35.5" r="1" fill="#B8D8D0"/>
  <circle cx="20.5" cy="39.5" r="1" fill="#B8D8D0"/>
  <circle cx="24" cy="39" r="1" fill="#B8D8D0"/>
